name: reactory-fullstack
services:
  reactory_mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: reactory-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-reactory}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-reactory-core}
      MONGO_INITDB_DATABASE: ${MONGO_DB:reactory-local-reactory}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    networks:
      - reactory-network

  reactory_postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: reactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REACTORY_POSTGRES_USER:-reactory}
      POSTGRES_PASSWORD: ${REACTORY_POSTGRES_PASSWORD:-reactory}
      POSTGRES_DB: ${REACTORY_POSTGRES_DB:-reactory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REACTORY_POSTGRES_USER:-reactory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    networks:
      - reactory-network
  
  reactory_meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_VERSION:-v1.13}
    container_name: reactory-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-reactory}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    networks:
      - reactory-network

  reactory_redis:
    image: redis:${REDIS_VERSION:-7.4}
    container_name: reactory-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REACTORY_REDIS_PASSWORD:-reactory}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    command: ["redis-server", "--requirepass", "${REACTORY_REDIS_PASSWORD:-reactory}"]
    networks:
      - reactory-network
  
  reactory_jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION:-1.76.0}
    container_name: reactory-jaeger
    restart: unless-stopped
    ports:
      - '${JAEGER_OTLP_HTTP_PORT:-4318}:4318'
      - '${JAEGER_UI_PORT:-16686}:16686'
    volumes:
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    networks:
      - reactory-network
  
  reactory_grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.4}
    container_name: reactory-grafana
    restart: unless-stopped
    ports:
      - '${REACTORY_GRAFANA_PORT:-3000}:3000'
    volumes:
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
      - ${REACTORY_SERVER}/src/modules/reactory-telemetry/data/grafana/provisioning:/etc/grafana/provisioning
      - ${REACTORY_SERVER}/src/modules/reactory-telemetry/data/grafana/models/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SERVER_ROOT_CA_CERT=/etc/ssl/certs/ca-certificates.crt
      - GF_SERVER_HTTP_PORT=3000
      - GF_SECURITY_ADMIN_PASSWORD=${REACTORY_GRAFANA_ADMIN_PASSWORD:-reactory}
    networks:
      - reactory-network

  reactory_grafana_loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.2}
    container_name: reactory-grafana-loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ${REACTORY_SERVER}/certificates:/etc/ssl/certs
    networks:
      - reactory-network

  reactory_prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.12.0}
    container_name: reactory-prometheus
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ${REACTORY_SERVER}/src/modules/reactory-telemetry/data/prometheus:/etc/prometheus
    networks:
      - reactory-network

  reactory_express_server:
    image: localhost/${REACTORY_CONFIG_ID:-reactory}/reactory-express-server:${BUILD_VERSION:-latest}
    pull_policy: never
    container_name: ${REACTORY_CONFIG_ID:-reactory}-express-server
    working_dir: /${REACTORY_CONFIG_ID:-reactory}/${REACTORY_CONFIG_ID:-reactory}-express-server
    command: bin/run-otel.sh
    ports:
      - '4000:4000'
      - '9464:9464'
    volumes:
      - ${REACTORY_DATA}:/reactory/reactory-data
      - ${REACTORY_CLIENT}:/reactory/reactory-client
      - ${REACTORY_SERVER}/config/${REACTORY_CONFIG_ID:-reactory}/.env.${REACTORY_ENV_ID:-podman}:/reactory/reactory-express-server/.env
    environment:
      - REACTORY_HOME=/reactory
      - REACTORY_DATA=/reactory/reactory-data
      - REACTORY_SERVER=/reactory/reactory-express-server
      - REACTORY_CLIENT=/reactory/reactory-client
      - REACTORY_PLUGINS=/reactory/reactory-data/plugins
    networks:
      - reactory-network

  reactory_pwa_client:
    image: localhost/${REACTORY_CONFIG_ID:-reactory}/reactory-pwa-client:${BUILD_VERSION:-latest}
    pull_policy: never
    container_name: reactory-pwa-client
    ports:
      - '9000:80'
    volumes:
      - ${REACTORY_CLIENT}/build/reactory:/usr/share/nginx/html
    networks:
      - reactory-network

volumes:
  postgres_data:
  meilisearch_data:
  mongodb_data:
  redis-data:

networks:
  reactory-network: