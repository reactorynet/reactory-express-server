# reactory-dev.RunWorkflowESTests@1.0.0
#
# Runs the Jasmine test suite for the reactory-workflow-es core library.
#
# The workflow-es `core` package uses Jasmine (not Jest).  Its package.json
# defines:
#   "pretest": "npm run build"   — TypeScript must compile before specs run
#   "test":    "jasmine"         — Jasmine reads core/spec/ for test files
#
# This workflow runs `npm test` inside core/ which triggers the build+jasmine
# sequence.  Because the TypeScript compilation step must precede Jasmine,
# running jasmine directly is not safe — always go through `npm test`.
#
# For selective spec execution the workflow supports a Jasmine filter string
# passed as JASMINE_FILTER env var, which maps to the jasmine --filter flag.
#
# Inputs:
#   filter    (optional) — Jasmine spec filter string (substring match on
#                          describe/it labels). Maps to `jasmine --filter`.
#   workdir   (optional) — path to the workflow-es repo root.
#                          Defaults to $REACTORY_WORKFLOW_ES env var, then
#                          falls back to $REACTORY_HOME/reactory-workflow-es.
#   skipBuild (optional) — "true" to skip the TypeScript pretest build step
#                          (use only when the build is known to be current).
nameSpace: reactory-dev
name: RunWorkflowESTests
version: 1.0.0
description: "Build and run the reactory-workflow-es core Jasmine test suite."
tags: [dev, test, jasmine, workflow-es]
metadata:
  timeout: 300000

inputs:
  filter:
    type: string
    required: false
    description: "Jasmine spec filter string — substring matched against describe/it labels."
  workdir:
    type: string
    required: false
    description: "Path to the reactory-workflow-es repo root. Defaults to $REACTORY_WORKFLOW_ES or $REACTORY_HOME/reactory-workflow-es."
  skipBuild:
    type: string
    required: false
    default: "false"
    description: "Set to 'true' to skip the TypeScript build step (jasmine only)."

steps:
  # ── 0. Resolve repo root ─────────────────────────────────────────────────
  - id: resolveWorkdir
    type: cli_command
    config:
      command: "node"
      args:
        - "-e"
        - |
          const wd = process.env.WD;
          if (wd && !wd.startsWith('${')) { process.stdout.write(wd); process.exit(0); }
          const explicit = process.env.REACTORY_WORKFLOW_ES;
          if (explicit) { process.stdout.write(explicit); process.exit(0); }
          const home = process.env.REACTORY_HOME || process.cwd();
          const path = require('path');
          process.stdout.write(path.join(home, 'reactory-workflow-es'));
      env:
        WD: "${input.workdir}"
      output:
        captureStdout: true
        captureStderr: false

  - id: setWorkdir
    type: set_variable
    dependsOn: resolveWorkdir
    config:
      action: set
      key: repoRoot
      source: step_output
      sourcePath: resolveWorkdir.outputs.stdout

  # ── 1. Resolve the core/ subdirectory ────────────────────────────────────
  - id: resolveCoreDir
    type: cli_command
    dependsOn: setWorkdir
    config:
      command: "node"
      args:
        - "-e"
        - |
          const path = require('path');
          process.stdout.write(path.join(process.env.REPO_ROOT, 'core'));
      env:
        REPO_ROOT: "${variables.repoRoot}"
      output:
        captureStdout: true
        captureStderr: false

  - id: setCoreDir
    type: set_variable
    dependsOn: resolveCoreDir
    config:
      action: set
      key: coreDir
      source: step_output
      sourcePath: resolveCoreDir.outputs.stdout

  # ── 2. Build the jasmine command ──────────────────────────────────────────
  # When a filter is supplied it is passed via `--filter=<filter>` to jasmine.
  # When skipBuild is true, runs `npx jasmine` directly; otherwise `npm test`
  # which triggers the pretest TypeScript compilation first.
  - id: buildCommand
    type: cli_command
    dependsOn: setCoreDir
    config:
      command: "node"
      args:
        - "-e"
        - |
          const filter    = process.env.FILTER;
          const skipBuild = process.env.SKIP_BUILD === 'true';
          const hasFilter = filter && !filter.startsWith('${');
          let cmd;
          if (skipBuild) {
            cmd = hasFilter
              ? `npx jasmine --filter=${JSON.stringify(filter)}`
              : 'npx jasmine';
          } else {
            // npm test runs: tsc (pretest) then jasmine
            // Jasmine args can be appended after -- when using npm
            cmd = hasFilter
              ? `npm test -- --filter=${JSON.stringify(filter)}`
              : 'npm test';
          }
          process.stdout.write(cmd);
      env:
        FILTER:     "${input.filter}"
        SKIP_BUILD: "${input.skipBuild}"
      output:
        captureStdout: true
        captureStderr: false

  - id: setCommand
    type: set_variable
    dependsOn: buildCommand
    config:
      action: set
      key: testCommand
      source: step_output
      sourcePath: buildCommand.outputs.stdout

  - id: logStart
    type: log
    dependsOn: setCommand
    config:
      level: info
      message: "Running workflow-es tests in '${variables.coreDir}' — command: ${variables.testCommand}"

  # ── 3. Execute tests ──────────────────────────────────────────────────────
  - id: runTests
    type: cli_command
    dependsOn: logStart
    config:
      command: "bash"
      args: ["-c", "${variables.testCommand}"]
      cwd: "${variables.coreDir}"
      failOnError: false
      expectedExitCodes: [0, 1]
      output:
        captureStdout: true
        captureStderr: true

  # ── 4. Report results ─────────────────────────────────────────────────────
  - id: reportResults
    type: condition
    dependsOn: runTests
    config:
      condition: "steps.runTests.exitCode === 0"
      thenSteps:
        - id: logPass
          type: log
          config:
            level: info
            message: "workflow-es core tests PASSED."
      elseSteps:
        - id: logFail
          type: log
          config:
            level: error
            message: "workflow-es core tests FAILED — review output above for details."
