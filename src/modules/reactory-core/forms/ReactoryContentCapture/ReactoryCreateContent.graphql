mutation ReactoryCreateContent($createInput: CreateContentInput!){
  ReactoryCreateContent(createInput: $createInput){
    id
    slug
    title
    description
    content
    topics
    published
    version
    locale
    template
    engine
    previewInputForm
    helpTopic
    createdBy {
      id
      fullName
    }
    createdAt
    updatedAt
  }
}
