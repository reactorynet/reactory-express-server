query ReactoryGetContentBySlug($slug: String!) {
  ReactoryGetContentBySlug(slug: $slug){
    id
    slug
    title
    description
    content
    published
    topics
    version
    locale
    template
    engine
    previewInputForm
    helpTopic
    createdBy {
      id
      fullName
    }
    createdAt
    updatedAt
  }
}
