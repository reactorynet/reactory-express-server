"""
Retention sweep request. Expressed in days so a scheduled sweep does not have to
compute cutoffs, and so the intent is visible at the call site.
"""
input WorkflowRetentionInput {
  """Delete terminal instances created more than this many days ago."""
  olderThanDays: Int!
  """
  Statuses eligible for sweeping. Defaults to [COMPLETE, TERMINATED].
  Runnable and Suspended are rejected - they are live work.
  """
  statuses: [String!]
  """Max instances processed per batch. Defaults to 500, capped at 500."""
  batchSize: Int
  """Max batches per call. Defaults to 20. Caps how much one run can do."""
  maxBatches: Int
  """Report the match count without deleting."""
  dryRun: Boolean = false
}

"""Outcome of a retention sweep."""
type WorkflowRetentionResult {
  success: Boolean!
  message: String
  """Instances matched by the retention predicate."""
  matched: Int!
  """Instances actually deleted (0 when dryRun)."""
  deleted: Int!
  """Batches executed."""
  batches: Int!
  """True when work remains (hit maxBatches) - run again to continue."""
  hasMore: Boolean!
  """The computed cutoff timestamp."""
  cutoff: String!
  """Statuses that were eligible."""
  statuses: [String!]!
  dryRun: Boolean!
  durationMs: Int!
}

"""
Pagination input for workflow history queries
"""
input WorkflowHistoryPaginationInput {
  """Page number (1-based)"""
  page: Int = 1
  """Number of items per page"""
  limit: Int = 10
  """Field to sort by"""
  sortField: WorkflowHistorySortField = createTime
  """Sort order"""
  sortOrder: SortOrder = DESC
}

"""
Fields available for sorting workflow history
"""
enum WorkflowHistorySortField {
  createTime
  completeTime
  workflowDefinitionId
  status
}

# ─── Termination reason / salvage (REACTORY-302016408) ────────────────────────

"""
Machine-readable cause of a terminal transition.

`UNKNOWN` is a value, not a failure: it means the engine reached a terminal
status without an attributed cause (a row written before reasons were recorded,
or a process that died before it could write one). Silence is no longer possible.
"""
enum TerminationReasonCode {
  CRASH
  OOM
  CANCELLED
  TIMEOUT
  PROVIDER_ERROR
  SHUTDOWN
  UNKNOWN
}

"""Where a termination reason was captured (cancel, dead-letter, process, ...)."""
enum TerminationReasonSource {
  CANCEL
  TIMEOUT
  DEAD_LETTER
  PROVIDER
  STEP
  PROCESS
  SHUTDOWN
  OWNER
  DERIVED
}

"""
Why an instance was TERMINATED.

Present on every TERMINATED row — including the DeadLettered status that is
displayed as TERMINATED — and null while the instance is live. Null for COMPLETE
instances as well: a successful run has no termination reason, so
`terminationReason != null` is a reliable filter for "this run did not finish".
"""
type WorkflowTerminationReason {
  """Machine-readable cause."""
  code: TerminationReasonCode!
  """Human-readable detail, including the step error when there was one."""
  message: String!
  """When the cause was observed."""
  time: DateTime!
  """How the reason was captured."""
  source: TerminationReasonSource!
  """
  False when the reason was synthesised on read because the instance terminated
  without a recorded reason (legacy row / pre-fix path). The answer is still a
  real one — "the engine does not know" — but it was not attributed.
  """
  recorded: Boolean!
}

"""
Work left behind by a terminated run, recorded so it can be salvaged instead of
silently discarded.

The workflow engine never runs `git`: the owner reports the worktree facts, the
engine persists them and refuses to delete the instance row until the record is
resolved (committed SHA, published SHA, or an explicit acknowledgement).
"""
type WorkflowSalvageRecord {
  """True when unpublished work is believed to still exist."""
  required: Boolean!
  """Absolute path of the worktree, when reported."""
  worktreePath: String
  """Branch the work should live on, when reported."""
  branch: String
  """HEAD SHA of the worktree when the record was taken."""
  headSha: String
  """Whether the worktree had uncommitted changes."""
  dirty: Boolean
  """Number of changed files observed."""
  changedFileCount: Int
  """Operator-facing detail (e.g. why it could not be published)."""
  message: String
  """When the record was taken."""
  recordedAt: DateTime!
  """When a consumer acknowledged the record (allows cleanup)."""
  acknowledgedAt: DateTime
  """Who acknowledged it."""
  acknowledgedBy: String
  """Commit that preserved the work, when it was salvaged by committing."""
  salvageSha: String
  """Merge/PR SHA, when the work was published."""
  publishedSha: String
  """True while the record still blocks cleanup."""
  unresolved: Boolean!
}

"""Input for recording worktree salvage facts against a terminated instance."""
input WorkflowSalvageInput {
  worktreePath: String!
  branch: String
  headSha: String
  dirty: Boolean
  changedFileCount: Int
  message: String
  required: Boolean
}

