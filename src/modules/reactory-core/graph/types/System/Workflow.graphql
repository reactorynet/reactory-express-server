# Workflow Registry Types
"""Source type of a workflow definition."""
enum WorkflowType {
  """Declarative workflow loaded from a YAML file via the YamlFlow engine."""
  YAML
  """Programmatic workflow defined as a TypeScript / JavaScript class."""
  CODE
}

type WorkflowDependency {
  id: String!
  nameSpace: String!
  name: String!
  type: DependencyType!
  version: String!
  optional: Boolean
  description: String
}

enum DependencyType {
  WORKFLOW
  SERVICE
  DATA
  EXTERNAL
}

type RegisteredWorkflow {
  id: String!
  name: String!
  nameSpace: String!
  version: String!
  description: String
  tags: [String!]
  author: String
  createdAt: DateTime
  updatedAt: DateTime
  isActive: Boolean
  status: String
  configuration: WorkflowConfig
  instances: [WorkflowInstance!]
  dependencies: [WorkflowDependency!]
  schedule: WorkflowSchedule
  schedules: [WorkflowSchedule!]
  """Computed field indicating if the workflow has any schedules"""
  hasSchedule: Boolean
  statistics: WorkflowStatistics
  errors: [WorkflowError!]
  """Execution history from MongoDB persistence (last 10 executions)"""
  executionHistory: [WorkflowExecutionHistory!]
  """Whether this is a YAML-based declarative workflow or a code-based workflow."""
  workflowType: WorkflowType
  """File system path or source location of the workflow definition."""
  location: String
}

"""Source location categories for YAML workflow definitions."""
enum WorkflowSourceType {
  """Shipped as part of a Reactory server module."""
  MODULE
  """Stored in the application CDN workflow catalog ($REACTORY_DATA/workflows/catalog)."""
  CATALOG
  """Stored in a user-specific directory."""
  USER
}

