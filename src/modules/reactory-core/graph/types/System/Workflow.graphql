  height: Float!
}

input DesignerCanvasSettingsInput {
  zoom: Float
  panX: Float
  panY: Float
  gridSize: Int
  snapToGrid: Boolean
}

input DesignerConnectionMetadataInput {
  id: String
  sourceStepId: String!
  sourcePort: String!
  targetStepId: String!
  targetPort: String!
  points: [DesignerPositionInput!]
  style: String
  color: String
  label: String
}

input DesignerNoteInput {
  id: String!
  text: String!
  position: DesignerPositionInput!
  size: DesignerSizeInput
  color: String
}

input DesignerGroupInput {
  id: String!
  label: String!
  stepIds: [String!]!
  color: String
  collapsed: Boolean
}

input DesignerPortMetadataInput {
  name: String!
  label: String
  position: DesignerPositionInput
  dataType: String
}

input StepDesignerPortsMetadataInput {
  inputs: [DesignerPortMetadataInput!]
  outputs: [DesignerPortMetadataInput!]
}

input StepDesignerMetadataInput {
  position: DesignerPositionInput
  size: DesignerSizeInput
  color: String
  icon: String
  collapsed: Boolean
  helpText: String
  ports: StepDesignerPortsMetadataInput
}

input DesignerMetadataInput {
  canvas: DesignerCanvasSettingsInput
  connections: [DesignerConnectionMetadataInput!]
  notes: [DesignerNoteInput!]
  groups: [DesignerGroupInput!]
}

input WorkflowStepInput {
  id: String!
  name: String
  description: String
  type: String!
  enabled: Boolean
  continueOnError: Boolean
  timeout: Int
  inputs: JSON
  outputs: JSON
  condition: String
  dependsOn: JSON
  config: JSON
  steps: [WorkflowStepInput!]
  designer: StepDesignerMetadataInput
}

"""Input type for saving a raw YAML workflow file to the catalog."""
input SaveWorkflowYamlInput {
  nameSpace: String!
  name: String!
  version: String!
  """Raw YAML source text to write verbatim to the catalog file."""
  yamlContent: String!
}

"""Input type for saving a workflow definition to the YAML catalog."""
input WorkflowDefinitionInput {
  nameSpace: String!
  name: String!
  version: String!
  description: String
  author: String
  tags: [String!]
  inputs: JSON
  outputs: JSON
  variables: JSON
  metadata: JSON
  steps: [WorkflowStepInput!]!
  designer: DesignerMetadataInput
}

"""Result of a workflow definition validation."""
type WorkflowValidationResult {
  isValid: Boolean!
  errors: [WorkflowValidationError!]
  warnings: [WorkflowValidationError!]
}

"""A single validation error or warning on a workflow definition."""
type WorkflowValidationError {
  field: String
  message: String!
  code: String
}

# Legacy compatibility types
type WorkflowResult {
  name: String
  result: JSON
}

input WorkflowInput {
  name: String
  input: JSON
}

# Queries
"""
A port on a step's designer definition (control/data input or output).
"""
type WorkflowStepDesignerPort {
  name: String!
  type: String!
  dataType: String
  required: Boolean
  description: String
}

"""
Designer rendering/config definition a module attaches to a contributed step,
mirroring the PWA designer's StepDefinition. Schema/uiSchema/rendering are opaque
JSON passed through to the designer.
"""
type WorkflowStepDesignerDefinition {
  id: String
  name: String
  category: String
  description: String
  icon: String
  color: String
  inputPorts: [WorkflowStepDesignerPort!]
  outputPorts: [WorkflowStepDesignerPort!]
  propertySchema: JSON
  uiSchema: JSON
  inputsSchema: JSON
  inputsUiSchema: JSON
  defaultProperties: JSON
  tags: [String!]
  rendering: JSON
}

"""
One entry in the workflow step catalog: a registered engine step type plus any
designer definition its contributor provided.
"""
type WorkflowStepCatalogEntry {
  stepType: String!
  description: String
  version: String
  source: String!
  definition: WorkflowStepDesignerDefinition
}

extend type Query {
  # System Status
  workflowSystemStatus: SystemStatus

  # Workflow Registry
  """
  Registered workflow definitions.

  `includeStatistics` is OPT-IN because per-workflow execution statistics require
  an aggregation over the entire workflow-instance collection (instances embed
  their execution pointers, so the collection is large). Callers that only need
  identity - id / name / version - should leave it off: when false no instance
  scan is performed at all and `statistics` comes back null.

  Filters that are defined in terms of statistics (`hasErrors`, `neverRun`)
  implicitly turn it on, since they would otherwise filter on a null value.
  """
  workflows(
    filter: WorkflowFilterInput
    pagination: PaginationInput
    """Include per-workflow execution statistics. Defaults to false."""
    includeStatistics: Boolean = false
    """Stats cache lifetime in ms. 0 disables caching. Defaults to WORKFLOW_STATS_CACHE_MS (30000)."""
    statsMaxAgeMs: Int
  ): PaginatedWorkflows

  workflowRegistry: WorkflowRegistryResponse

  workflow(
    nameSpace: String!
    name: String!
    version: String
  ): [RegisteredWorkflow]

  workflowWithId(
    id: String!
  ): RegisteredWorkflow

  # Workflow Instances (in-memory)
  workflowInstances(
    filter: InstanceFilterInput
    pagination: PaginationInput
  ): PaginatedInstances

  workflowInstance(id: String!): WorkflowInstance

  # Workflow Execution History (MongoDB persistence)
  """
  Get paginated workflow execution history from MongoDB.
  Supports filtering by workflow definition, status, and date ranges.
  """
  workflowExecutionHistory(
    filter: WorkflowHistoryFilterInput
    pagination: WorkflowHistoryPaginationInput
  ): PaginatedWorkflowHistory

  """
  Get a single workflow execution history item by instance ID.
  """
  workflowExecutionHistoryById(
    instanceId: String!
  ): WorkflowExecutionHistory

  """
  Get the CDN URL for the log file of a specific workflow instance.
  Returns null when no log file exists yet.
  """
  workflowInstanceLogFileUrl(
    instanceId: String!
  ): String

  """
  Get workflow execution history for a specific workflow definition.
  """
  workflowExecutionHistoryByDefinitionId(
    workflowDefinitionId: String!
    pagination: WorkflowHistoryPaginationInput
  ): PaginatedWorkflowHistory

  """
  Search workflow execution history with text matching.
  """
  searchWorkflowExecutionHistory(
    searchTerm: String!
    pagination: WorkflowHistoryPaginationInput
  ): PaginatedWorkflowHistory

  """
  Get recent workflow executions (most recent first).
  """
  recentWorkflowExecutions(
    limit: Int = 10
  ): [WorkflowExecutionHistory!]!

  """
  Get aggregated workflow execution statistics.
  """
  workflowExecutionStats: WorkflowExecutionStats

  # Workflow Schedules
  workflowSchedules(
    filter: WorkflowFilterInput
    pagination: PaginationInput
  ): PaginatedSchedules

  workflowSchedule(id: String!): [WorkflowSchedule]

  # Audit and Monitoring
  workflowAuditLog(
    filter: AuditFilterInput
    pagination: PaginationInput
  ): PaginatedAuditLogs

  workflowMetrics: MetricsResponse

  # Configuration
  workflowConfigurations: ConfigurationResponse

  # YAML Workflow Definitions
  """
  Load a YAML workflow definition by workflow identity.
  Resolves the YAML file from the workflow's registered location,
  parses it, and returns the full definition including designer metadata.
  Always returns a result — check loadStatus and errors for failure details
  rather than treating a null return as an indicator of failure.
  """
  workflowYamlDefinition(
    nameSpace: String!
    name: String!
    version: String
  ): YamlWorkflowDefinition!

  """
  Catalog of all registered workflow step types, including designer definitions
  contributed by modules. Used by the Visual Workflow Designer to render module
  steps and stay aligned with the engine's registered steps.
  """
  workflowStepCatalog: [WorkflowStepCatalogEntry!]!

  # Legacy compatibility
  workflowStatus(name: String!): WorkflowResult
}

# Mutations
extend type Mutation {
  # Workflow Execution
  startWorkflow(
    workflowId: String!
    input: WorkflowExecutionInput
  ): WorkflowInstance @auth(roles: ["USER"])

  # Instance Management
  pauseWorkflowInstance(instanceId: String!): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])
  resumeWorkflowInstance(instanceId: String!): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])
  """
  Cancel a running instance.

  `reason` is persisted as the instance's termination reason (code CANCELLED) and
  is shown in the execution history, so an operator cancel is distinguishable
  from a crash, an OOM or a provider failure.
  """
  cancelWorkflowInstance(
    instanceId: String!
    reason: String
  ): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])

  """
  Record worktree salvage facts for a terminated run (path, branch, HEAD, dirty
  state). Owners of the worktree call this; the engine never runs git. While the
  record is unresolved the instance cannot be deleted by history cleanup or the
  retention sweep.
  """
  recordWorkflowInstanceSalvage(
    instanceId: String!
    input: WorkflowSalvageInput!
  ): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])

  """
  Resolve a salvage record: a commit that preserved the work (`salvageSha`), a
  published merge (`publishedSha`), or an explicit acknowledgement that the work
  is intentionally discarded. Unblocks deletion/cleanup.
  """
  acknowledgeWorkflowInstanceSalvage(
    instanceId: String!
    note: String
    salvageSha: String
    publishedSha: String
  ): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])

  # Event signalling (continue steps waiting for an event)
  publishWorkflowEvent(
    eventName: String!
    eventKey: String!
    eventData: JSON
  ): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])
  signalWorkflowInstance(
    instanceId: String!
    stepId: String
    eventData: JSON
  ): WorkflowOperationResult @auth(roles: ["WORKFLOW_ADMIN", "WORKFLOW_OPERATOR"])

  # Schedule Management
  createWorkflowSchedule(
    config: ScheduleConfigInput!
  ): WorkflowSchedule @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  updateWorkflowSchedule(
    scheduleId: String!
    updates: UpdateScheduleInput!
  ): WorkflowSchedule @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  deleteWorkflowSchedule(scheduleId: String!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  startSchedule(scheduleId: String!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])
  stopSchedule(scheduleId: String!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])
  reloadSchedules: WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  # Workflow Execution History Management
  """
  Delete a single workflow execution history item by instance ID.
  """
  deleteWorkflowExecutionHistory(instanceId: String!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """
  Delete multiple workflow execution history items by instance IDs.
  """
  deleteWorkflowExecutionHistoryBatch(instanceIds: [String!]!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """
  Clear all workflow execution history for a specific workflow definition.
  Use with caution - this operation cannot be undone.
  """
  clearWorkflowExecutionHistory(workflowDefinitionId: String!): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """
  Time-scoped retention sweep: delete terminal (COMPLETE / TERMINATED) instances
  created more than `olderThanDays` ago, in bounded batches.

  Runnable and Suspended instances are live work and are never swept, even if
  requested. Use `dryRun: true` first to size the impact.

  This exists because the instance collection is append-only: without retention,
  registry and dashboard reads get slower with every run ever executed.
  """
  sweepWorkflowInstances(input: WorkflowRetentionInput!): WorkflowRetentionResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  # Legacy compatibility
  startWorkflowLegacy(name: String!, data: WorkflowInput): Boolean @auth(roles: ["USER"])

  # ─── Workflow Definition CRUD ──────────────────────────────────────────────
  """Save (create or update) a workflow definition to the YAML catalog."""
  saveWorkflowDefinition(definition: WorkflowDefinitionInput!): YamlWorkflowDefinition @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """Save raw YAML text directly to the YAML catalog, preserving formatting and comments."""
  saveWorkflowYaml(input: SaveWorkflowYamlInput!): YamlWorkflowDefinition @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """Delete a workflow definition from the YAML catalog."""
  deleteWorkflowDefinition(nameSpace: String!, name: String!, version: String): WorkflowOperationResult @auth(roles: ["ADMIN", "WORKFLOW_ADMIN"])

  """Validate a workflow definition without saving it."""
  validateWorkflowDefinition(definition: WorkflowDefinitionInput!): WorkflowValidationResult @auth(roles: ["USER"])
}
