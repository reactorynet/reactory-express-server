# Workflow Execution History Types (from MongoDB persistence)
"""
Represents a workflow execution history item from the MongoDB persistence layer.
This contains the complete execution history of a workflow instance.
"""
type WorkflowExecutionHistory {
  """Unique identifier for the workflow instance"""
  id: String!
  """The workflow definition ID (e.g., 'core.CleanCacheWorkflow@1.0.0')"""
  workflowDefinitionId: String!
  """Semantic version of the workflow definition (M11 — was Int! before 3.0.0)"""
  version: String!
  """Current status of the workflow (0=Pending, 1=Running, 2=Complete, 3=Terminated, 4=Suspended)"""
  status: Int!
  """Human-readable status label"""
  statusLabel: String!
  """Optional description"""
  description: String
  """When the workflow was created"""
  createTime: DateTime!
  """When the workflow completed (if completed)"""
  completeTime: DateTime
  """Duration in milliseconds"""
  duration: Int
  """Input data for the workflow"""
  data: JSON
  """Execution pointers (step details)"""
  executionPointers: [ExecutionPointerSummary!]!
  """Total number of steps"""
  stepCount: Int!
  """Number of completed steps"""
  completedStepCount: Int!
  """Number of failed steps"""
  failedStepCount: Int!
  """
  CDN-relative URL to the per-instance log file produced by InstanceResourceManager.
  Returns null when no log file exists for this instance.
  """
  logFileUrl: String
  """
  Why this instance was terminated. Non-null for every TERMINATED row (incl.
  DeadLettered, displayed as TERMINATED); null for COMPLETE and live instances.
  """
  terminationReason: WorkflowTerminationReason
  """
  Last moment the ENGINE made progress (persisted heartbeat, pointer start/end
  times and createTime, whichever is latest).

  Compare against wall-clock time: a run whose lastActivity is hours old while
  the agent is still writing files is "the engine lost track", not "the engine is
  idle". This is the signal the incident lacked: 41 completed steps, then 2.5
  hours of file writes that nothing surfaced.
  """
  lastActivity: DateTime
  """Unpublished work left behind, when a terminated run recorded any."""
  salvage: WorkflowSalvageRecord
}

"""
Summary of an execution pointer (workflow step)
"""
type ExecutionPointerSummary {
  """Unique identifier for the step execution"""
  id: String!
  """Step identifier within the workflow definition"""
  stepId: Int!
  """Human-readable step name — the YAML step id for bridged workflows"""
  stepName: String
  """Status of the step"""
  status: Int!
  """Human-readable status label"""
  statusLabel: String!
  """When the step started"""
  startTime: DateTime
  """When the step ended"""
  endTime: DateTime
  """Duration in milliseconds"""
  duration: Int
  """Number of retry attempts"""
  retryCount: Int!
  """Whether the step is currently active"""
  active: Boolean!
  """Persistence data stored by the step"""
  persistenceData: JSON
  """Event data associated with the step"""
  eventData: JSON
  """Event name if the step is waiting for an event"""
  eventName: String
  """Event correlation key the step is waiting on (used to publish/signal the event)"""
  eventKey: String
  """Whether the awaited event has already been published/consumed"""
  eventPublished: Boolean
  """Outcome data from the step"""
  outcome: JSON
  """The most recent error message from the last failed execution of this step"""
  errorMessage: String
  """The most recent error stack trace from the last failed execution of this step"""
  errorStack: String
  """The time the most recent error occurred"""
  errorTime: DateTime
  """Full array of errors captured across all retry attempts for this step"""
  errors: [StepExecutionError!]
}

"""
Error captured during a step execution attempt
