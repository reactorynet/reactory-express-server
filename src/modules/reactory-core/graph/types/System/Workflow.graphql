"""The full YAML workflow definition including visual designer metadata."""
type YamlWorkflowDefinition {
  nameSpace: String!
  name: String!
  version: String!
  description: String
  author: String
  tags: [String!]
  inputs: JSON
  outputs: JSON
  variables: JSON
  metadata: JSON
  steps: [YamlWorkflowStep!]!
  designer: DesignerMetadata
  """The raw YAML source text."""
  yamlSource: String
  """The source type indicating where this definition was loaded from."""
  sourceType: WorkflowSourceType
  """The resolved file path the definition was loaded from."""
  location: String
  """
  Overall load status.
  SUCCESS means fully usable. Any other value means the definition could not be
  fully loaded — check the errors array for details.
  """
  loadStatus: YamlLoadStatus!
  """Ordered list of errors captured at each processing stage."""
  errors: [YamlLoadError!]
  """
  Step-level validation errors produced by running the YAML executor's
  validation pass (step type registry checks, config validation, dependency
  resolution) without actually executing the workflow.
  Only populated when the definition was successfully loaded (loadStatus = SUCCESS).
  """
  validationErrors: [WorkflowValidationError!]
}

"""Overall status of a YAML workflow definition load attempt."""
enum YamlLoadStatus {
  """Fully loaded and parsed without errors."""
  SUCCESS
  """Loaded but with validation warnings; the definition may be partially usable."""
  PARTIAL
  """Workflow not in registry or the YAML file could not be located."""
  NOT_FOUND
  """File was located but could not be read from disk."""
  IO_ERROR
  """File was read but the YAML content could not be parsed."""
  PARSE_ERROR
  """The workflow exists in the registry but is not a YAML-type workflow."""
  REGISTRY_ERROR
}

"""The processing stage at which a YAML load error occurred."""
enum YamlLoadStage {
  REGISTRY
  FILE_RESOLVE
  FILE_READ
  PARSE
  VALIDATION
}

"""A single error captured during YAML workflow definition loading."""
type YamlLoadError {
  """The processing stage at which the error occurred."""
  stage: YamlLoadStage!
  """Human-readable description of the error."""
  message: String!
  """Short machine-readable error code."""
  code: String
  """Line number within the YAML source (populated for parse errors)."""
  line: Int
  """Column number within the YAML source (populated for parse errors)."""
  column: Int
}

