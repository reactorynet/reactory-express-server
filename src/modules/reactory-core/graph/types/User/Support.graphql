
"""
Reactory Support Ticket
"""
type ReactorySupportTicket {
  """
  The internal id
  """
  id: String
  """
  The user request, short title
  """
  request: String
  """
  The type of user request
  """
  requestType: String
  """
  The request description, a fuller longer detailed description
  """
  description: String
  """
  Request status
  """
  status: String
  """
  Priority level of the ticket
  """
  priority: String
  """
  Request reference
  """
  reference: String
  """
  logged by user
  """
  createdBy: User
  """
  Date the ticket was logged
  """
  createdDate: Date
  """
  Date the ticket was updated
  """
  updatedDate: Date
  """
  Who the ticket is assigned to
  """
  assignedTo: User
  """
  Any meta data, interpretation of this will be up to the client
  """
  meta: Any
  """
  Comments array for the ticket
  """
  comments: [Comment]
  """
  The documents attached to this request
  """
  documents: [ReactoryFile]  
  """
  The form id from where the request originated. Optional
  """
  formId: String
  """
  Tags associated with the ticket
  """
  tags: [String]
  """
  SLA deadline
  """
  slaDeadline: Date
  """
  Whether the ticket is overdue
  """
  isOverdue: Boolean
  """
  AI triage bookkeeping (first-class)
  """
  triage: ReactorySupportTicketTriage
  """
  SLA escalation bookkeeping (first-class)
  """
  escalation: ReactorySupportTicketEscalation
}

"""
AI triage bookkeeping for a support ticket (first-class field).
"""
type ReactorySupportTicketTriage {
  """When the ticket was triaged (presence marks it as triaged)"""
  triagedAt: Date
  """Who/what triaged it (persona or user id)"""
  triagedBy: String
  """Classified category"""
  category: String
  """Priority the triage applied"""
  priority: String
  """Owner user id the triage assigned"""
  assignedToUserId: String
  """Owner email resolved from support-routing.yaml"""
  ownerEmail: String
  """Why that owner/priority was chosen"""
  ownerRationale: String
  """Whether follow-up work was flagged"""
  followUpRequired: Boolean
  """Specialised persona consulted, if any"""
  delegatedPersona: String
  """Model confidence (0-1) where reported"""
  confidence: Float
  """Short triage summary"""
  summary: String
}

"""
A single escalation event in the ticket's escalation trail.
"""
type ReactorySupportTicketEscalationEntry {
  level: Int
  at: Date
  actions: [String]
}

"""
SLA escalation bookkeeping for a support ticket (first-class field).
"""
type ReactorySupportTicketEscalation {
  """Current escalation level"""
  level: Int
  """When the ticket was last escalated"""
  lastEscalatedAt: Date
  """Actions applied at the last escalation"""
  actions: [String]
  """Explicit hold — escalation skipped until this instant"""
  holdUntil: Date
  """Snapshot of the escalation policy in force"""
  policy: Any
  """Append-only escalation trail"""
  history: [ReactorySupportTicketEscalationEntry]
}

"""
Input type used to update a Reactory Support Ticket
"""
input ReactorySupportTicketUpdate {
  """
  The user request, short title
  """
  request: String
  """
  The type of user request
  """
  requestType: String
  """
  The request description, a fuller longer detailed description
  """
  description: String
  """
  Request status
  """
  status: String
  """
  id of the user to assgign the ticket to
  """
  assignTo: String
  """
  Comment
  """
  comment: String
  """
  Priority level (critical, high, medium, low)
  """
  priority: String
  """
  Tags to set on the ticket
  """
  tags: [String]
}

"""
Paged Reactory Support Tickets
"""
type PagedReactorySupportTickets {
  """
  Paging request
  """
  paging: PagingResult
  """
  The ticket array
  """
  tickets: [ReactorySupportTicket]
}

"""
Paged Reactory Support Tickets Filter Input
"""
input ReactorySupportTicketFilter {
  """
  String array of user ids
  """
  assignedTo: [String]
  """
  String array of user status ids
  """
  status: [String]
  """
  Filter by priority levels
  """
  priority: [String]
  """
  Ticket refernce number
  """
  reference: [String]
  """
  Search string
  """
  searchString: String
  """
  Start Date
  """
  startDate: Date
  """
  End Date
  """
  endDate: Date
  """
  Date fields to search against
  """
  dateFields: [String]
  """
  Include a form id to keep the results to a specific form
  """
  formId: String
  """
  Filter by tags
  """
  tags: [String]
  """
  Show only overdue tickets
  """
  showOverdueOnly: Boolean
  """
  Filter by request types
  """
  requestType: [String]
  """
  Show only tickets that have no assignee
  """
  unassignedOnly: Boolean

}

input ReactorySupportTicketDeleteInput {
  """
  The ticket id to delete
  """
  ids: [String]!
  """
  The reason for the deletion
  """
  reason: String
}

type ReactorySupportTicketDeleteSuccess {
  ids: [String]
}

type ReactorySupportTicketDeleteError {
  ids: [String]
  error: String
}

union ReactorySupportTicketDeleteResult = ReactorySupportTicketDeleteSuccess | ReactorySupportTicketDeleteError

"""
Input for adding a comment to a support ticket
"""
input ReactorySupportTicketCommentInput {
  """
  The ticket ID to add the comment to
  """
  ticketId: String!
  """
  The comment text (supports HTML/Markdown)
  """
  comment: String!
  """
  Parent comment ID for threaded replies
  """
  parentId: String
  """
  Attachments for the comment
  """
  attachmentIds: [String]
}

"""
Input for attaching files to a support ticket
"""
input ReactorySupportTicketAttachmentInput {
  """
  The ticket ID to attach files to
  """
  ticketId: String!
  """
  Array of file IDs (already uploaded via ReactoryUploadFile)
  """
  fileIds: [String!]!
}

"""
Success result for file attachment
"""
type ReactorySupportTicketAttachmentSuccess {
  success: Boolean!
  ticket: ReactorySupportTicket!
  attachedFiles: [ReactoryFile!]!
}

"""
Error result for file attachment
"""
type ReactorySupportTicketAttachmentError {
  error: String!
  message: String
}

"""
Union result for file attachment
"""
union ReactorySupportTicketAttachmentResult = ReactorySupportTicketAttachmentSuccess | ReactorySupportTicketAttachmentError

extend type Query {
  """
  Returns paged tickets that were created by the logged in user
  """
  ReactoryMySupportTickets(paging: PagingRequest, filter: ReactorySupportTicketFilter): PagedReactorySupportTickets
  """
  Returns support tickets based on search input
  """
  ReactorySupportTickets(paging: PagingRequest, filter: ReactorySupportTicketFilter): PagedReactorySupportTickets  
}

extend type Mutation {
  """
  Creates a new support for the logged in user
  """
  ReactoryCreateSupportTicket(request: String!, description: String!, requestType: String, priority: String, meta: Any, formId: String): ReactorySupportTicket @auth(roles: ["USER"])
  """
  Updates a ticket with either a status update, assignment change or comment add
  """
  ReactoryUpdateSupportTicket(ticket_id: String, updates: ReactorySupportTicketUpdate): ReactorySupportTicket @auth(roles: ["USER"])

  """
  Deletes a / multiple support tickets
  """
  ReactoryDeleteSupportTicket(deleteInput: ReactorySupportTicketDeleteInput!): ReactorySupportTicketDeleteResult @auth(roles: ["USER"])
  
  """
  Adds a comment to a support ticket
  """
  ReactoryAddSupportTicketComment(input: ReactorySupportTicketCommentInput!): Comment @auth(roles: ["USER"])
  
  """
  Attaches files to a support ticket
  """
  ReactoryAttachFilesToTicket(input: ReactorySupportTicketAttachmentInput!): ReactorySupportTicketAttachmentResult @auth(roles: ["USER"])
}