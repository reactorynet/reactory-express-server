# ORG-006: organization demographics configuration and value surface.
#
# A `DemographicDefinition` describes *what* an organization tracks (gender,
# employment type, business unit, ...), how it is typed, validated and rendered.
# A `DemographicValue` is one member's value for one definition in one
# organization. Both are organization-scoped: a definition owned by organization
# A can never be used to write a value in organization B.
#
# Configuration mutations are additionally guarded by the service's org-scoped
# `assertOrgAdmin` check (an ORGANIZATION_ADMIN of A cannot administer B); the
# `@auth` roles below are only the coarse first gate.

"""
One choice of an `enum` / `multi-enum` definition.
"""
type DemographicOption {
  key: String!
  label: String
  ordinal: Int
  deprecated: Boolean
}

"""
Structural reference target (business unit, team, region, ...).
"""
type DemographicReference {
  model: String!
  multiple: Boolean
}

"""
Optional custom input component. `componentPropsMap` maps context paths onto
the component's prop names, following the existing Reactory `ui:props-map`
convention.
"""
type DemographicWidget {
  componentFqn: String
  componentProps: Any
  componentPropsMap: Any
}

"""
An organization-scoped demographic definition.

`schema` is a JSON Schema fragment used for extra validation of the stored
value (in addition to the `valueType` shape check). `system` marks a seeded
base definition: an organization may rename, reorder or disable it, but may
not change its `valueType`.
"""
type DemographicDefinition {
  id: String
  organization: String
  key: String!
  title: String!
  description: String
  icon: String
  """
  One of: personal, employment, organizational, compliance.
  """
  category: String
  """
  One of: string, number, boolean, date, enum, multi-enum, object, array,
  reference.
  """
  valueType: String!
  """
  JSON Schema fragment validated with ajv on every value write.
  """
  schema: Any
  options: [DemographicOption!]
  reference: DemographicReference
  widget: DemographicWidget
  required: Boolean
  """
  When true the stored value is an array of the declared `valueType`.
  """
  multiValued: Boolean
  """
  PII marker: gates reporting/export and audit logging.
  """
  sensitive: Boolean
  searchable: Boolean
  enabled: Boolean
  ordinal: Int
  roles: [String!]
  system: Boolean
  deleted: Boolean
  createdBy: String
  updatedBy: String
  createdAt: Date
  updatedAt: Date
}

"""
One member's value for one definition.
`key` and `valueType` are snapshots taken at write time so reports keep
working after a definition is renamed or retyped.
"""
type DemographicValue {
  id: String
  organization: String
  user: String
  membership: String
  definition: String
  key: String
  value: Any
  valueType: String
  """
  One of: user, admin, import, api.
  """
  source: String
  verified: Boolean
  effectiveFrom: Date
  effectiveTo: Date
  updatedBy: String
  createdAt: Date
  updatedAt: Date
}

type PagedDemographicValues {
  values: [DemographicValue!]!
  paging: PagingResult
}

"""
Thin organization-level demographics policy (design decision D4).

There is at most one document per organization. Reading it before it has ever
been written returns these defaults without persisting anything.
"""
type OrganizationDemographicsPolicy {
  id: String
  organization: String
  """
  Whether members may maintain their own values. Defaults to true.
  """
  selfServiceEnabled: Boolean!
  """
  Definition keys that only an organization administrator may write, even when
  self-service is enabled.
  """
  adminOnlyKeys: [String!]!
  """
  Smallest cohort a report may return (k-anonymity). Defaults to 5.
  """
  minimumAggregationGroupSize: Int
  """
  Value retention in days; null retains indefinitely.
  """
  retentionDays: Int
  createdAt: Date
  updatedAt: Date
}

input DemographicOptionInput {
  key: String!
  label: String
  ordinal: Int
  deprecated: Boolean
}

input DemographicReferenceInput {
  model: String!
  multiple: Boolean
}

input DemographicWidgetInput {
  componentFqn: String
  componentProps: Any
  componentPropsMap: Any
}

"""
Create or update payload for a definition. Omit a field to leave it unchanged.
`key` is immutable once the definition exists. Pass `id` to update by id;
otherwise the definition is matched by `key`.
"""
input DemographicDefinitionInput {
  id: String
  key: String
  title: String
  description: String
  icon: String
  category: String
  valueType: String
  schema: Any
  options: [DemographicOptionInput!]
  reference: DemographicReferenceInput
  widget: DemographicWidgetInput
  required: Boolean
  multiValued: Boolean
  sensitive: Boolean
  searchable: Boolean
  enabled: Boolean
  ordinal: Int
  roles: [String!]
  """
  Marks a seeded base definition. Accepted on creation only (ORG-030 seeds
  through this mutation); the flag is immutable afterwards, in both directions.
  """
  system: Boolean
}

"""
A value write. `user` may only name somebody other than the caller on the
administrative mutations; `MySaveDemographics` rejects it.
"""
input DemographicValueInput {
  id: String
  user: String
  membership: String
  key: String
  definition: String
  value: Any
  source: String
  verified: Boolean
  effectiveFrom: Date
  effectiveTo: Date
}

input DemographicValueFilter {
  user: String
  membership: String
  key: String
  definition: String
  value: Any
  source: String
  verified: Boolean
}

input OrganizationDemographicsPolicyInput {
  selfServiceEnabled: Boolean
  adminOnlyKeys: [String!]
  minimumAggregationGroupSize: Int
  retentionDays: Int
}

# ---------------------------------------------------------------------------
# ORG-035: aggregate reporting.
#
# These types describe a *privacy-filtered* view of the data, not the raw
# values. Two rules shape every field below and must not be relaxed:
#
# 1. `minimumAggregationGroupSize` is read from the organization's policy and
#    echoed on the report. A cohort smaller than it is removed entirely - it is
#    never zeroed and never folded into an "other" bucket - and
#    `suppressedCohorts` says how many buckets were withheld (null when nothing
#    survives - see the field doc). Bucket counts are therefore always >= the
#    threshold.
# 2. There is no pre-suppression total anywhere. `cohortTotal` and
#    `percentageDenominator` are the same number: the distinct members behind
#    the *surviving* buckets. Returning a population count as well would let a
#    caller recover a suppressed cohort by subtraction, and reporting only the
#    post-suppression total keeps that closed.

"""
One bucket of a distribution. `count` is a number of DISTINCT MEMBERS, not of
selections: a multi-valued definition can put one member in several buckets, so
`percentage` values may sum above 100. `percentage` is computed against
`DemographicDefinitionAggregate.percentageDenominator`.
"""
type DemographicAggregateBucket {
  key: String!
  label: String!
  count: Int!
  percentage: Float!
}

"""
Aggregation of one definition for one organization and filter set.

`suppressed: true` means nothing may be reported for this definition - either
nobody answered or every bucket was below the threshold. The two cases are
indistinguishable on purpose: every field matches, including
`suppressedCohorts`, which is null in both cases, so the payload never reveals
which one applies - nor whether the definition has any answers at all.
"""
type DemographicDefinitionAggregate {
  definitionKey: String!
  title: String!
  category: String
  valueType: String!
  multiValued: Boolean!
  """
  PII marker, copied from the definition. Sensitive definitions are aggregated
  like any other, but the read is written to the audit trail and the surface is
  organization-administrator only.
  """
  sensitive: Boolean!
  suppressed: Boolean!
  """
  How many buckets were withheld. A bucket count, never a member count.

  Null when `suppressed` is true. Once nothing survives, the number of
  withheld buckets is itself a disclosure - two withheld buckets would say
  that two distinct answers exist, each held by 1..k-1 members - and it would
  make "nobody answered" distinguishable from "a small cohort". Masking it is
  what makes those two reports identical. A partially suppressed definition
  still reports the count, because a caller who already sees surviving buckets
  cannot use it to reconstruct a withheld one.
  """
  suppressedCohorts: Int
  """
  Distinct members behind the surviving buckets. This is the ONLY total in the
  payload and it is also the percentage denominator.
  """
  cohortTotal: Int!
  """
  Explicit alias of `cohortTotal`, so a UI cannot relabel the denominator.
  """
  percentageDenominator: Int!
  """
  Always `respondents` today. Present so percentages can never be mislabelled
  as a share of the organization's headcount.
  """
  denominatorKind: String!
  buckets: [DemographicAggregateBucket!]!
}

"""
Echo of the filters actually applied, so an export or a screenshot is
self-describing. Dates are ISO-8601 strings.

`cohortRestricted` is true when a structural filter (businessUnit / team /
region) narrowed the member set. A structural filter that matches nobody
yields an empty cohort and therefore an all-suppressed report - it never falls
back to "everybody".
"""
type DemographicAggregateFilterEcho {
  businessUnit: String
  team: String
  region: String
  effectiveFrom: String
  effectiveTo: String
  definitionKeys: [String!]!
  cohortRestricted: Boolean!
}

type DemographicAggregateReport {
  organization: String!
  """
  The k-anonymity threshold actually applied, read from the organization's
  demographics policy (never hardcoded).
  """
  minimumAggregationGroupSize: Int!
  filter: DemographicAggregateFilterEcho!
  definitions: [DemographicDefinitionAggregate!]!
  reportedDefinitions: Int!
  """
  Definitions withheld entirely because nothing survived the threshold.
  """
  suppressedDefinitions: Int!
}

input DemographicAggregateFilter {
  """
  Business unit id. Resolved against the member's organization membership, so
  a client-wide membership (organizationId: null) never satisfies it.
  """
  businessUnit: String
  team: String
  region: String
  effectiveFrom: Date
  effectiveTo: Date
}

# The organization's demographics policy, resolved from
# `reactory_organization_demographics_policies` and defaulted on read.
# (Descriptions are not allowed on type extensions.)
extend type Organization {
  demographicsPolicy: OrganizationDemographicsPolicy
}

extend type Query {
  """
  Lists the organization's demographic definitions, ordered by ordinal.
  Soft-deleted definitions are never returned; disabled ones only when
  `includeDisabled` is true.

  Requires membership of the organization. `sensitive` definitions are
  administrator-only, so they are omitted from a non-administrator's result.

  NOTE: this is a top-level query with this exact name and an
  `organizationId` argument - the organization management plugin
  (ORG-010) calls it directly.
  """
  OrganizationDemographicDefinitions(organizationId: String!, includeDisabled: Boolean): [DemographicDefinition!]! @auth(roles: ["USER"])

  """
  Loads one definition by key. Requires organization membership; a
  `sensitive` definition additionally requires organization administration.
  """
  OrganizationDemographicDefinition(organizationId: String!, key: String!): DemographicDefinition @auth(roles: ["USER"])

  """
  Organization-wide value listing. Requires an organization administrator:
  this is the reporting/compliance surface.
  """
  OrganizationDemographicValues(organizationId: String!, filter: DemographicValueFilter, paging: PagingRequest): PagedDemographicValues @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  The caller's own demographic values. `membershipId` is accepted for
  multi-organization members and is recorded on writes, not used to select
  another user.
  """
  MyDemographics(organizationId: String!, membershipId: String): [DemographicValue!]! @auth(roles: ["USER"])

  """
  Counts and distributions per definition for one organization (ORG-035).

  Cohorts below the organization's `minimumAggregationGroupSize` are
  suppressed per cohort, and the threshold is returned on the report so the UI
  can explain the gap. Organization-administrator only: this is enforced by the
  service's org-scoped `assertOrgAdmin`, not by the `@roles` argument, which is
  only the coarse first gate (an administrator of organization A must not read
  organization B).
  """
  OrganizationDemographicAggregates(organizationId: String!, definitionKeys: [String!], filter: DemographicAggregateFilter): DemographicAggregateReport! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  CSV export of `OrganizationDemographicAggregates` (ORG-035).

  Modelled as a query, not a mutation, because it reads and changes nothing: a
  mutation would imply a write, need write-side guards and defeat HTTP caching,
  while a query is idempotent and safe to retry. It is not a second reporting
  path - the resolver delegates to the same service method as the JSON query,
  so authorization, suppression and auditing cannot drift between the two.

  The export always has a header row and a stable column order (see
  `DEMOGRAPHIC_AGGREGATE_CSV_COLUMNS`), and a suppressed definition still
  produces a row so "suppressed" can never be mistaken for "missing".
  """
  OrganizationDemographicAggregatesCsv(organizationId: String!, definitionKeys: [String!], filter: DemographicAggregateFilter): String! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])
}

extend type Mutation {
  """
  Creates or updates a definition. The key is immutable once created and a
  `system` definition cannot change its value type.
  """
  OrganizationSaveDemographicDefinition(organizationId: String!, definition: DemographicDefinitionInput!): DemographicDefinition! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Soft-deletes a definition. Rejected when stored values still reference it;
  disable the definition instead.
  """
  OrganizationDeleteDemographicDefinition(organizationId: String!, key: String!): Boolean! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Applies the supplied key order as the definitions' ordinal.
  """
  OrganizationReorderDemographicDefinitions(organizationId: String!, keys: [String!]!): [DemographicDefinition!]! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Enables or disables one definition without touching stored values.
  """
  OrganizationSetDemographicEnabled(organizationId: String!, key: String!, enabled: Boolean!): DemographicDefinition! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Creates the policy on first write, updates it afterwards.
  """
  OrganizationUpdateDemographicsPolicy(organizationId: String!, policy: OrganizationDemographicsPolicyInput!): OrganizationDemographicsPolicy! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Writes one value for a named user (or the caller). Validated against the
  definition; invalid payloads are rejected with field-level errors. Writing
  for another user requires organization administration.
  """
  OrganizationSaveDemographicValue(organizationId: String!, value: DemographicValueInput!): DemographicValue! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Bulk value write. Every row is validated before anything is persisted, so a
  bad row cannot leave the batch half-applied.
  """
  OrganizationBulkSaveDemographicValues(organizationId: String!, values: [DemographicValueInput!]!): [DemographicValue!]! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Deletes one value; `user` defaults to the caller and may only name somebody
  else when the caller administers the organization.
  """
  OrganizationDeleteDemographicValue(organizationId: String!, key: String!, user: String): Boolean! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM", "USER"])

  """
  Saves the caller's own values. Any `user` naming somebody else is rejected,
  and the write is refused when the organization policy disables self-service
  or the definition key is restricted to administrators.
  """
  MySaveDemographics(organizationId: String!, values: [DemographicValueInput!]!, membershipId: String): [DemographicValue!]! @auth(roles: ["USER"])
}
