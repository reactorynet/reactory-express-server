
"""
NOTE: Spelling of the entity is Organization with a Z, in the system although it is accepted that
some spellings use Organisation with a S. The Reactory system will always prefer the Z spelling.

Basic Organisation Structure, implements the basics structure 
of an Organisations.
"""
type Organization {
  """
  internal id, when using default storage this is a BSON mongo id.
  if the organization data is proxied from a another system this will still 
  be a string but the format may vary from uuid to int or a standard string
  """
  id: String
  """
  the meta object represents additional unstructured meta
  data we want to associate with the organization object.
  in many scenarios, this would represent a foreign 
  system meta data to create a logical link for queries 
  and caching / syncronization purposes.
  """
  meta: Any
  """
  Any document, this currently not used in any uses cases
  but uses cases would include, linked organizations, etc.
  """
  settings: Any
  """
  A string short code
  """
  code: String
  """
  The organization name as it is used from day to day
  """
  name: String
  """
  The trading name, this would be the full entity name as registered 
  a regional or national business registry
  """
  tradingName: String
  """
  The registered legal entity name, when it differs from the trading name.
  """
  legalName: String
  """
  A short, human readable description of the organization.
  """
  description: String
  """
  The organization website.
  """
  website: String
  """
  Primary contact email address for the organization.
  """
  contactEmail: String
  """
  Primary contact telephone number for the organization.
  """
  contactPhone: String
  """
  Lifecycle state: active, suspended or archived. Archived organizations are
  retained (never hard deleted) and hidden from default listings.
  """
  status: String
  """
  Whether the organization is publicly visible. Public organizations are
  readable without an explicit client allow-list entry.
  """
  public: Boolean
  """
  The logo filename, just the the filename.  This should ideally be a 16:9 ratio png / svg / jpg
  """
  logo: String
  """
  The resolved url for the logo with the timestamp of when the organization was updated.  This
  will prevent any long term caching of assets that may have changed
  """
  logoURL: String
  """
  The avatar filename. This should ideally be a 1:1 aspect ration png / svg / jpg
  """
  avatar: String
  """
  The resolved url for the avatar with the timestamp of when the organization was updated.
  """
  avatarURL: String
  """
  The name of the active theme for this organization. Null when the
  organization has no theme assigned; consumers then fall back to the
  client theme and finally the default theme.
  """
  theme: String
  """
  The active theme mode for this organization (light, dark or os).
  """
  themeMode: ApplicationThemeModeType
  """
  Themes owned by this organization. They use exactly the same shape as the
  themes on a ReactoryClient so the same editor and resolution logic apply.
  """
  themes: [ApplicationTheme]
  """
  A list of business units within the organization
  """
  businessUnits: [BusinessUnit]
  """
  This field is deprecated and references will be removed.
  """
  legacyId: Int
  
  """
  The time and date the organization was created
  """
  createdAt: Date
  """
  Time and date the organization was updated
  """
  updatedAt: Date
}

input CreateOrganizationInput {
  code: String
  name: String
  logo: String
  legacyId: Int
}


input UpdateOrganizationInput {
  """
  A null or blank value clears the field; omit it to leave it unchanged.
  """
  code: String
  """
  A null or blank value is rejected: an organization must always have a name.
  """
  name: String
  """
  The registered trading name. A null or blank value clears the field.
  """
  tradingName: String
  """
  The registered legal entity name. A null or blank value clears the field.
  """
  legalName: String
  """
  A short description. A null or blank value clears the field.
  """
  description: String
  """
  The organization website. A null or blank value clears the field.
  """
  website: String
  """
  Primary contact email. A null or blank value clears the field.
  """
  contactEmail: String
  """
  Primary contact telephone number. A null or blank value clears the field.
  """
  contactPhone: String
  """
  Lifecycle state: active, suspended or archived.
  """
  status: String
  """
  The name of the active theme. A null or blank value clears the pointer.
  """
  theme: String
  """
  The active theme mode (light, dark or os).
  """
  themeMode: ApplicationThemeModeType
  """
  Whether the organization is publicly visible.
  """
  public: Boolean
  """
  The avatar filename/alias. A null or blank value clears the field.
  """
  avatar: String
  logo: String
  settings: [Any]
  legacyId: Int
}

"""
Counts used by the organization dashboard. Deliberately flat so it can be
produced with a bounded number of aggregate queries.
"""
type OrganizationStatistics {
  """
  Number of users with a membership for this organization.
  """
  members: Int
  """
  Number of (non-deleted) business units in this organization.
  """
  businessUnits: Int
  """
  Number of (non-deleted) teams in this organization.
  """
  teams: Int
}

type UpdateResponse {
  id: ObjID
  errors: [String]
  updated: Boolean
}


type OrganizationLookup {
  id: String
  name: String
}

type OrganizationLookupData {
  regions: [OrganizationLookup]
  operationalGroups: [OrganizationLookup]
  businessUnit: [OrganizationLookup]
  team: [OrganizationLookup]
}

input OrganizationLookupDataInput {
  regions: [Any]
  operationalGroups: [Any]
  businessUnit: [Any]
  team: [Any]
}

type OrganizationLookupDataCaptureResponse {
  success: Boolean
  message: String
}

type PagedOrganizations {
  paging: PagingResult
  organizations: [Organization]
}

extend type Query {  
  """
  Deprecated query will be removed in the future, use the CoreOrganizations instead
  """
  allOrganizations(legacy: Boolean): [Organization]@deprecated(reason: "Use CoreOrganizations instead")

  """
  Deprecated query will be removed in the future, use the CoreOrganizations instead
  """
  organizationsForUser(id: String!): [Organization]@deprecated(reason: "Use CoreOrganizations instead")
  """
  Deprecated query will be removed in the future, use the CoreOrganization instead
  """
  organizationWithId(id: String!): Organization @deprecated(reason: "Use CoreOrganization instead")
  """
  Returns an organization with the given id
  """
  CoreOrganization(id: String!): Organization
  """
  List of organizations that the logged in user has access to in an alphabetical order
  """
  CoreOrganizations(search: String): [Organization]
  """
  Paged list of organizations that the logged in user has access to in an alphabetical order
  """
  CorePagedOrganizations(search: String, paging: PagingRequest): PagedOrganizations
  """
  List of organizations that the logged in user has access to in an alphabetical order
  """
  CoreUsersForOrganization(id: String!, searchString: String, paging: PagingRequest): PagedUserResults
  GetOrganisationLookupData(orgId: String!): OrganizationLookupData
  """
  Reads the custom CSS published for a theme, used by the theme CSS studio.
  """
  OrganizationThemeCss(themeName: String!): String
  """
  Member, business unit and team counts for an organization.
  """
  OrganizationStatistics(id: String!): OrganizationStatistics @auth(roles: ["USER"])
}

extend type Mutation {
  """
  Creates an organization. Requires a platform ADMIN or SYSTEM: an
  ORGANIZATION_ADMIN has no authority beyond the organization they administer.
  """
  createOrganization(input: CreateOrganizationInput!): Organization @auth(roles: ["ADMIN", "SYSTEM"])

  """
  Updates an organization's identity, lifecycle and branding fields. The
  service additionally enforces org-scoped authorization: an
  ORGANIZATION_ADMIN may only update the organization they administer.
  """
  updateOrganization(id: String!, input: UpdateOrganizationInput!): Organization @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Archives an organization without deleting it. Requires org-scoped
  authorization (ORGANIZATION_ADMIN of this organization, or ADMIN).
  """
  archiveOrganization(id: String!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Restores an archived organization to the active state. Requires org-scoped
  authorization.
  """
  restoreOrganization(id: String!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Upserts a named setting on the organization. Requires org-scoped
  authorization.
  """
  OrganizationSetSetting(id: String!, name: String!, data: Any, componentFqn: String): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Removes a named setting from the organization. Requires org-scoped
  authorization.
  """
  OrganizationRemoveSetting(id: String!, name: String!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Adds a user to the organization (creating or re-activating their membership).
  Requires org-scoped authorization.
  """
  addOrganizationMember(id: String!, userId: String!, roles: [String!]): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Removes a user's membership for the organization. Requires org-scoped
  authorization.
  """
  removeOrganizationMember(id: String!, userId: String!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Replaces a member's roles for the organization. Requires org-scoped
  authorization.
  """
  setOrganizationMemberRoles(id: String!, userId: String!, roles: [String!]!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  SetOrganisationLookupData(lookupData: OrganizationLookupDataInput!): OrganizationLookupData @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Creates or updates a theme on the organization. A theme is matched by name
  or id; a match is merged so partial updates keep the existing fields.
  """
  OrganizationSaveTheme(id: String!, theme: ApplicationThemeInput!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Sets the active theme for the organization. When `mode` is supplied it also
  sets the active theme mode. An unknown theme name is rejected.
  """
  OrganizationSetActiveTheme(id: String!, themeName: String!, mode: ApplicationThemeModeType): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Deletes a theme from the organization. Deleting the active theme activates
  the first remaining theme, or clears the pointer when none remain.
  """
  OrganizationDeleteTheme(id: String!, themeName: String!): Organization! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])

  """
  Publishes custom CSS for a theme to the theme folder on disk.
  """
  OrganizationPublishThemeCss(id: String!, themeName: String!, css: String!): Boolean! @auth(roles: ["ORGANIZATION_ADMIN", "ADMIN", "SYSTEM"])
}
