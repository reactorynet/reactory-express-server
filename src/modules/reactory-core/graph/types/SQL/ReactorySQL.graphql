enum Operator {
  EQ
  GT
  GTEQ
  LT
  LTEQ
  BETWEEN
  LIKE
  IN
}

enum OperationModifier {
  AND
  OR
}

type SQLColumn {
  field: String
  title: String
  widget: String
  selected: Boolean
}

input SQLColumnInput {
  field: String
  title: String
  widget: String
  selected: Boolean
}


type SQLContext {
  schema: String
  table: String
  commandText: String
  provider: String
  connectionId: String
}

input SQLContextInput {
  schema: String
  table: String
  commandText: String
  provider: String
  connectionId: String
}

type SQLFilter {
  field: String
  value: Any
  operator: Operator
  modifier: OperationModifier
  invert: Boolean
}

input SQLFilterInput {
  field: String
  title: String
  value: Any
  operator: Operator
}

input PagingRequest {
  page: Int
  pageSize: Int
  total: Int
  hasNext: Boolean
}

type PagingResult {
  total: Int
  page: Int
  hasNext: Boolean
  pageSize: Int
}

type SQLQueryResult {
  paging: PagingResult
  columns: [ SQLColumn ]
  filters: [ SQLFilter ]
  context: SQLContext
  data: [ Any ]
}

type SQLInsertResult {
  columns: [ SQLColumn ]
  success: Boolean
  recordsAffected: Int
}

type SQLUpdateResult {
  success: Boolean
  recordsAffected: Int
}

type SQLDeleteResult {
  success: Boolean
  recordsAffected: Int
}

input SQLQuery {
  paging: PagingRequest
  columns: [ SQLColumnInput ]
  filters: [ SQLFilterInput ]
  context: SQLContextInput
}

input SQLInsert {
  columns: [ SQLColumnInput ]
  values: [ Any ]
  context: SQLContextInput
}

input SQLUpdate {
  columns: [ SQLColumnInput ]
  values: [ Any ]
  context: SQLContextInput
}

input SQLDelete {
  columns: [ SQLColumnInput ]
  filter: [ SQLFilterInput ]
  context: SQLContextInput
}

type SQLDataConnection {
  "Setting name; pass as `connectionId` to ReactorySQLQuery."
  connectionId: String
  "Database variant backing the connection (postgres, mysql, mssql, databricks)."
  variant: String
  "Human readable display name for pickers. Falls back to the setting name."
  label: String
  "Human readable title from the client setting, when authored."
  title: String
  host: String
  port: Int
  database: String
  description: String
  "Roles required to use the connection. Empty means open to all callers."
  roles: [String]
}

extend type Query {
  ReactorySQLQuery(input: SQLQuery): SQLQueryResult
  """
  Lists the SQL-capable database connections available to the caller,
  resolved from the active partner's settings with role-aware filtering.
  Credentials are never returned.
  """
  ReactorySQLDataConnections(variants: [String]): [SQLDataConnection]
}

extend type Mutation {
  ReactorySQLInsert(input: SQLInsert): SQLInsertResult
  ReactorySQLUpdate(input: SQLUpdate): SQLUpdateResult
  ReactorySQLDelete(input: SQLDelete): SQLDeleteResult
}
