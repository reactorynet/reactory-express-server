# Managed by reactory-workspace `seed` (policy: public-upstream). Edits are
# overwritten on the next seed; change the template instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday

