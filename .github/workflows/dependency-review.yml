# Managed by reactory-workspace `seed` (policy: public-upstream).
# Fails a pull request that adds a dependency with a known high/critical
# vulnerability or a disallowed licence. Free on public repositories.
name: Dependency review

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
