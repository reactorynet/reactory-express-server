name: Build smoke test

# Exercises the same path bin/bic.sh drives locally: compile the server,
# build its container image. This is the check that would have caught the
# rsync-filter-trailing-newline, Dockerfile cert-verification, Yarn 4
# migration, and sibling-repo file: dependency bugs fixed in July 2026 —
# none of them were caught automatically before this workflow existed.

on:
  push:
    branches: [master]
    paths:
      - "bin/**"
      - "src/**"
      - "lib/**"
      - "config/reactory"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-smoke-test.yml"
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "lib/**"
      - "config/reactory"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-smoke-test.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # config/reactory is a submodule (reactory-express-server-devops) —
          # the Dockerfile actually being built lives there, not in this repo.
          # SUBMODULE_TOKEN is optional. A mirror whose config/reactory submodule
          # is private sets it to a read-only token for that repository; without
          # it the default GITHUB_TOKEN is used, which reads public submodules.
          # No later step needs git credentials, so they are not persisted.
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          persist-credentials: false

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # Core-only: the modules under src/modules are separate repos and absent here, so yarn.lock (written with them) cannot match; resolve afresh.
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Set up Reactory environment variables
        # check_env_vars (bin/shared/shell-utils.sh) requires these to be set
        # and to point at existing directories. reactory-data/-client/-plugins
        # aren't needed for the build itself, so throwaway dirs are enough.
        run: |
          mkdir -p /tmp/reactory-data /tmp/reactory-client /tmp/reactory-plugins
          echo "REACTORY_HOME=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "REACTORY_DATA=/tmp/reactory-data" >> "$GITHUB_ENV"
          echo "REACTORY_SERVER=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "REACTORY_CLIENT=/tmp/reactory-client" >> "$GITHUB_ENV"
          echo "REACTORY_PLUGINS=/tmp/reactory-plugins" >> "$GITHUB_ENV"

      - name: Generate a throwaway self-signed CA cert
        # Forces HAS_CUSTOM_CERTS=true so the Dockerfile's custom-cert
        # verification RUN step actually executes in CI — otherwise that
        # branch (previously broken: hardcoded nonexistent filename) only
        # ever runs on a dev machine that happens to have real certs locally.
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/ci-test-ca.key -out ./certificates/ci-test-ca.crt \
            -subj "/CN=reactory-ci-test-ca"

      # config/reactory/.env.podman is gitignored in the devops submodule; the
      # tracked sample (placeholder values) is enough to build.
      - name: Use the sample podman environment
        run: '[ -f config/reactory/.env.podman ] || cp config/reactory/env.podman-sample config/reactory/.env.podman'

      - name: Build server
        run: bin/build.sh reactory podman

      - name: Build server image
        run: bin/build-image.sh reactory podman

      # bin/build-image.sh BUILDS the image but never RUNS it, so a broken entrypoint, a missing
      # file: dependency or an unprovisioned browser is invisible to this workflow.
      #
      # playwright ships no browser; the Dockerfile provisions one with `playwright install`. This
      # runs the launch gate baked into the image, so a browser/package mismatch - the exact
      # failure that made playwright 1.59.1 -> 1.65.1 look safe on a developer machine and break in
      # production - fails HERE instead of at first browser macro.
      - name: Verify the built image can launch a browser
        run: |
          set -euo pipefail
          if command -v podman >/dev/null 2>&1; then RUNTIME=podman; else RUNTIME=docker; fi
          IMAGE="localhost/reactory/reactory-express-server:$(node -p "require('./package.json').version")"
          echo "Running the image launch gate against ${IMAGE} with ${RUNTIME}"
          # This workflow builds CORE-ONLY: src/modules are separate private repos and are
          # absent here, so there is no app/modules, no playwright workspace dependency and
          # therefore no browser to verify. Report that as SKIPPED rather than passing, so a
          # green run never implies a browser was proven to launch. The Dockerfile's own gate
          # still executes in a module-bearing (production) build, where it can.
          if ! "${RUNTIME}" run --rm "${IMAGE}" node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            echo "SKIPPED (not passed): this image has no playwright (core-only build, no modules)."
            echo "Browser provisioning is exercised only in a build that includes src/modules."
            exit 0
          fi
          "${RUNTIME}" run --rm "${IMAGE}" node /usr/local/bin/reactory-playwright-smoke.js

      # A launch is necessary but not sufficient: navigate, read the title and render a real PNG,
      # which is what ReactorPlaywrightService and the playwright workflow steps do.
      - name: Verify a real navigation and screenshot inside the image
        run: |
          set -euo pipefail
          if command -v podman >/dev/null 2>&1; then RUNTIME=podman; else RUNTIME=docker; fi
          IMAGE="localhost/reactory/reactory-express-server:$(node -p "require('./package.json').version")"
          # This workflow builds CORE-ONLY: src/modules are separate private repos and are
          # absent here, so there is no app/modules, no playwright workspace dependency and
          # therefore no browser to verify. Report that as SKIPPED rather than passing, so a
          # green run never implies a browser was proven to launch. The Dockerfile's own gate
          # still executes in a module-bearing (production) build, where it can.
          if ! "${RUNTIME}" run --rm "${IMAGE}" node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            echo "SKIPPED (not passed): this image has no playwright (core-only build, no modules)."
            echo "Browser provisioning is exercised only in a build that includes src/modules."
            exit 0
          fi
          "${RUNTIME}" run --rm "${IMAGE}" node /usr/local/bin/reactory-playwright-smoke.js \
            --navigate "data:text/html,<title>reactory-image-smoke</title><h1>navigation ok</h1>" \
            --screenshot /tmp/image-smoke.png
          echo "navigation + screenshot produced a PNG inside the image"

      # The operator-facing record of what provisioning costs, so a future change that starts
      # pulling firefox or webkit is visible in the log.
      - name: Report image size and provisioned browser
        run: |
          set -euo pipefail
          if command -v podman >/dev/null 2>&1; then RUNTIME=podman; else RUNTIME=docker; fi
          IMAGE="localhost/reactory/reactory-express-server:$(node -p "require('./package.json').version")"
          echo "image size: $("${RUNTIME}" image inspect "${IMAGE}" --format '{{.Size}}') bytes"
          # This workflow builds CORE-ONLY: src/modules are separate private repos and are
          # absent here, so there is no app/modules, no playwright workspace dependency and
          # therefore no browser to verify. Report that as SKIPPED rather than passing, so a
          # green run never implies a browser was proven to launch. The Dockerfile's own gate
          # still executes in a module-bearing (production) build, where it can.
          if ! "${RUNTIME}" run --rm "${IMAGE}" node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            echo "SKIPPED (not passed): this image has no playwright (core-only build, no modules)."
            echo "Browser provisioning is exercised only in a build that includes src/modules."
            exit 0
          fi
          "${RUNTIME}" run --rm "${IMAGE}" node -e "
            const path = require('path');
            const { chromium } = require(path.join(process.cwd(), 'node_modules', 'playwright'));
            console.log('  PLAYWRIGHT_BROWSERS_PATH =', process.env.PLAYWRIGHT_BROWSERS_PATH);
            console.log('  executablePath           =', chromium.executablePath());
          "

      # The image COPYs bin/verify/playwright-browser-smoke.js; the module repo keeps its own copy
      # at scripts/verify/ for jest and local runs. They must stay byte-identical or the gate that
      # guards the image stops guarding what the module tests. src/modules is absent in this
      # workflow (the modules are separate repos), so this reports SKIPPED there rather than
      # claiming a pass it did not verify.
      - name: Check the two copies of the smoke test agree
        run: |
          set -euo pipefail
          MODULE_COPY="src/modules/reactory-reactor/scripts/verify/playwright-browser-smoke.js"
          if [ -f "$MODULE_COPY" ]; then
            diff -u "$MODULE_COPY" bin/verify/playwright-browser-smoke.js
            echo "identical: $MODULE_COPY == bin/verify/playwright-browser-smoke.js"
          else
            echo "SKIPPED (not passed): $MODULE_COPY is absent - src/modules is gitignored in this"
            echo "checkout, so the drift check can only run in a checkout that has the module."
          fi
